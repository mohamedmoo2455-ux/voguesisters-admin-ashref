<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vogue Sisters | لوحة تحكم الإدارة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f7f3f4; color: #4a3b3d; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col justify-between">

    <div class="max-w-7xl mx-auto w-full space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-rose-100">
            <div>
                <h1 class="text-2xl font-bold text-rose-950">لوحة تحكم الأدمين (متابعة الطلبات السحابية) 📋</h1>
                <p class="text-xs text-stone-500 mt-1">تحديث لحظي لجميع طلبات وعناوين العملاء من السيرفر</p>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchAdminOrders()" class="bg-rose-50 text-rose-800 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-rose-100 transition">تحديث الطلبات 🔄</button>
            </div>
        </div>
        
        <!-- Orders Table -->
        <div class="bg-white rounded-3xl shadow-sm border border-rose-100 p-6 overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="border-b border-rose-100 text-rose-950 text-xs">
                        <th class="py-3 px-4">وقت الطلب</th>
                        <th class="py-3 px-4">اسم العميل</th>
                        <th class="py-3 px-4">رقم التليفون</th>
                        <th class="py-3 px-4">العنوان بالتفصيل</th>
                        <th class="py-3 px-4">المنتجات المطلوبة والمقاسات</th>
                        <th class="py-3 px-4">الإجمالي</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-table" class="text-xs text-stone-600">
                    <tr>
                        <td colspan="6" class="text-center py-12 text-stone-400">جاري جلب الطلبات من السيرفر...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-stone-400 py-4">
        Vogue Sisters Admin Panel © 2026
    </footer>

    <!-- Script to fetch live orders from Supabase -->
    <script>
        const SUPABASE_URL = 'https://girbqgwygqlwbppetpnt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8ncia4DA9WGoO_9YTFID-g_2lCvge3b'; // ضع مفتاحك الكامل هنا
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAdminOrders() {
            const tbody = document.getElementById('admin-orders-table');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-stone-400">جاري التحديث...</td></tr>`;

            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-red-500">حدث خطأ أثناء جلب البيانات!</td></tr>`;
                console.error(error);
                return;
            }

            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-stone-400">لا توجد طلبات جديدة حتى الآن..</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            orders.forEach(order => {
                let formattedDate = order.created_at ? new Date(order.created_at).toLocaleString('ar-EG') : 'وقت سابق';
                tbody.innerHTML += `
                    <tr class="border-b border-stone-100 hover:bg-rose-50/30 transition">
                        <td class="py-3 px-4 text-stone-400 text-[11px]">${formattedDate}</td>
                        <td class="py-3 px-4 font-bold text-stone-800">${order.customer_name}</td>
                        <td class="py-3 px-4 font-semibold text-rose-900">${order.phone}</td>
                        <td class="py-3 px-4 max-w-xs truncate">${order.address}</td>
                        <td class="py-3 px-4 text-stone-700 font-medium">${order.items}</td>
                        <td class="py-3 px-4 font-bold text-rose-700">${order.total}</td>
                    </tr>
                `;
            });
        }

        window.onload = fetchAdminOrders;
    </script>
</body>
</html>
